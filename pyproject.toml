[project]
name = "judgelab"
version = "0.0.1"
description = "Evidence-grounded visual judges for image agents: verifiable synthetic data, judge protocols, benchmarks."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["judgelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
